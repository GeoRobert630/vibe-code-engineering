[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-ci"
version = "0.1.0"
description = "Quality CI Phase 4A: accessibility checks (axe-core in headless Chromium), JSON/Markdown/SARIF reports and a CI gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }  # vendored axe-core is MPL-2.0 (src/quality_ci/vendor/axe-core-LICENSE.txt)
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=7"]

[project.scripts]
quality-ci = "quality_ci.cli:main"
quality-ci-perf = "quality_ci.performance.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["quality_ci", "quality_ci.performance"]

[tool.setuptools.package-data]
quality_ci = ["vendor/axe.min.js", "vendor/axe-core-LICENSE.txt", "vendor/README.md"]
"quality_ci.performance" = ["vendor/web-vitals.attribution.iife.js", "vendor/web-vitals-LICENSE.txt", "vendor/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q -m 'not repeat'"
markers = [
  "browser: needs Playwright and a Chromium-family browser (skipped when unavailable)",
  "repeat: repeatability suite (20x GOOD/SLOW/FIXED); deselected by default, run with -m repeat",
]
