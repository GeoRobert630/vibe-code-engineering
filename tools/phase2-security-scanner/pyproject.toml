[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase2-security-scanner"
version = "0.1.0"
description = "Read-only static security scanner used by the vibe-code-engineering 17-security-audit skill."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# PyYAML is the only runtime dependency. It is used exclusively through
# yaml.safe_load (never yaml.load) for rule files, the optional scanner config
# and pnpm lockfiles.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
phase2-scan = "phase2.cli:main"

[tool.setuptools]
# Map the top-level rules/ directory into the installed package as phase2/rules
# so a non-editable install still ships the rule files.
package-dir = { "" = "src", "phase2.rules" = "rules" }
packages = [
    "phase2",
    "phase2.scanners",
    "phase2.reporting",
    "phase2.baseline",
    "phase2.utils",
    "phase2.rules",
]

[tool.setuptools.package-data]
"phase2.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
