# Secret detection rules for the internal fallback scanner.
#
# Fields
#   id            stable rule identifier (appears in reports and baselines)
#   title         finding title
#   kind          dedup key; findings of the same kind on the same line merge
#                 (e.g. this scanner + gitleaks)
#   regex         Python regular expression, evaluated per line (lines capped at 4000 chars)
#   secret_group  capture group holding the secret value (default 1). The value is
#                 only used for placeholder/entropy checks and is never reported.
#   severity      CRITICAL | HIGH | MEDIUM | LOW | INFORMATIONAL
#   confidence    HIGH | MEDIUM | LOW  (confidence that the match is a real credential)
#   min_entropy   optional Shannon-entropy floor; lower values reduce confidence to LOW
#   check         optional post-check implemented in code: jwt | db_url | assignment | generic
#   files         optional: "env" limits the rule to .env-style files, "yaml" to YAML
#
# A match is a *potential* credential. Only a human (or a provider-side check)
# can confirm a key is live. Do not add rules that require network validation.

rules:
  - id: private-key
    title: Private key material
    kind: private-key
    regex: '-----BEGIN ((?:RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?)-----'
    severity: CRITICAL
    confidence: HIGH
    cwe: CWE-321

  - id: aws-access-key-id
    title: AWS access key ID
    kind: aws
    regex: '\b((?:AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16})\b'
    severity: HIGH
    confidence: MEDIUM
    cwe: CWE-798

  - id: aws-secret-access-key
    title: AWS secret access key
    kind: aws-secret
    regex: '(?i)aws[_.-]?(?:secret[_.-]?(?:access[_.-]?)?key|sk)[''"]?\s*(?:[:=]|=>)\s*[''"]?([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
    severity: CRITICAL
    confidence: HIGH
    min_entropy: 3.5
    cwe: CWE-798

  - id: github-token
    title: GitHub token
    kind: github-token
    regex: '\b(gh[pousr]_[A-Za-z0-9]{36,255})\b'
    severity: HIGH
    confidence: HIGH
    cwe: CWE-798

  - id: github-fine-grained-pat
    title: GitHub fine-grained personal access token
    kind: github-token
    regex: '\b(github_pat_[A-Za-z0-9_]{60,255})\b'
    severity: HIGH
    confidence: HIGH
    cwe: CWE-798

  - id: stripe-live-secret-key
    title: Stripe live secret/restricted key
    kind: stripe-secret
    regex: '\b((?:sk|rk)_live_[A-Za-z0-9]{20,247})\b'
    severity: CRITICAL
    confidence: HIGH
    cwe: CWE-798

  - id: stripe-test-secret-key
    title: Stripe test-mode secret key
    kind: stripe-secret
    regex: '\b((?:sk|rk)_test_[A-Za-z0-9]{20,247})\b'
    severity: LOW
    confidence: HIGH
    cwe: CWE-798

  - id: openai-api-key
    title: OpenAI-style API key
    kind: openai-key
    regex: '\b(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,300}|sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20})(?![A-Za-z0-9_-])'
    severity: HIGH
    confidence: HIGH
    cwe: CWE-798

  - id: anthropic-api-key
    title: Anthropic-style API key
    kind: anthropic-key
    regex: '\b(sk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{20,300})(?![A-Za-z0-9_-])'
    severity: HIGH
    confidence: HIGH
    cwe: CWE-798

  - id: generic-sk-key
    title: Possible "sk-" style API secret key
    kind: openai-key
    regex: '(?<![A-Za-z0-9_-])(sk-[A-Za-z0-9]{32,120})(?![A-Za-z0-9_-])'
    severity: HIGH
    confidence: MEDIUM
    min_entropy: 3.5
    cwe: CWE-798

  - id: slack-token
    title: Slack token
    kind: slack-token
    regex: '\b(xox[abposr]-[A-Za-z0-9-]{10,250})\b'
    severity: HIGH
    confidence: HIGH
    cwe: CWE-798

  - id: google-api-key
    title: Google API key
    kind: google-api-key
    # Firebase *web* API keys are public identifiers by design; severity stays MEDIUM
    # and the recommendation asks for API restrictions rather than rotation.
    regex: '\b(AIza[0-9A-Za-z_-]{35})(?![0-9A-Za-z_-])'
    severity: MEDIUM
    confidence: MEDIUM
    cwe: CWE-798

  - id: supabase-secret-key
    title: Supabase secret API key
    kind: supabase-service-role
    regex: '\b(sb_secret_[A-Za-z0-9_-]{20,200})'
    severity: CRITICAL
    confidence: HIGH
    cwe: CWE-798

  - id: jwt
    title: JWT-like credential
    kind: jwt
    regex: '\b(eyJ[A-Za-z0-9_-]{10,2000}\.eyJ[A-Za-z0-9_-]{10,4000}\.[A-Za-z0-9_-]{10,2000})'
    severity: MEDIUM
    confidence: MEDIUM
    check: jwt
    cwe: CWE-798

  - id: database-url-credentials
    title: Database connection string with embedded credentials
    kind: database-url
    regex: '\b((?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|mssql|sqlserver)://([^\s:/@''"`]{1,128}):([^\s@''"`/]{1,256})@([^\s/:''"`?]{1,253}))'
    secret_group: 3
    severity: HIGH
    confidence: MEDIUM
    check: db_url
    cwe: CWE-798

  - id: bearer-token
    title: Hard-coded bearer token
    kind: bearer-token
    regex: '(?i)[''"`]\s*bearer\s+([A-Za-z0-9._~+/-]{20,1000}=*)'
    severity: HIGH
    confidence: MEDIUM
    min_entropy: 3.5
    cwe: CWE-798

  - id: secret-assignment-code
    title: Hard-coded credential assignment
    kind: credential-assignment
    # name = "value" / name: 'value' / "name": "value" in source and config files
    regex: '(?i)\b([A-Za-z0-9_.-]{0,40}(?:password|passwd|pwd|secret|api[_-]?key|apikey|access[_-]?token|auth[_-]?token|client[_-]?secret|private[_-]?key|service[_-]?role[_-]?key|credentials?)[A-Za-z0-9_.-]{0,40})[''"]?\s*(?:[:=]|=>|:=)\s*[''"]([^''"\s]{8,300})[''"]'
    secret_group: 2
    severity: HIGH
    confidence: MEDIUM
    min_entropy: 2.5
    check: assignment
    cwe: CWE-798

  - id: secret-assignment-env
    title: Credential in environment file
    kind: credential-assignment
    regex: '^\s*(?:export\s+)?([A-Za-z0-9_]*(?:PASSWORD|PASSWD|PWD|SECRET|API_KEY|APIKEY|ACCESS_TOKEN|AUTH_TOKEN|CLIENT_SECRET|PRIVATE_KEY|SERVICE_ROLE|SERVICE_KEY|TOKEN|CREDENTIALS?)[A-Za-z0-9_]*)\s*=\s*[''"]?([^\s''"#]{6,500})'
    secret_group: 2
    severity: HIGH
    confidence: MEDIUM
    min_entropy: 2.5
    check: assignment
    files: env
    cwe: CWE-798

  - id: secret-assignment-yaml
    title: Credential in YAML configuration
    kind: credential-assignment
    regex: '^\s*(?:-\s*)?([A-Za-z0-9_.-]*(?:password|passwd|secret|api_?key|token|private_?key|PASSWORD|SECRET|API_KEY|TOKEN|PRIVATE_KEY)[A-Za-z0-9_.-]*)\s*[:=]\s*([^\s''"#{}$][^\s''"#]{5,300})\s*$'
    secret_group: 2
    severity: HIGH
    confidence: MEDIUM
    min_entropy: 2.5
    check: assignment
    files: yaml
    cwe: CWE-798

  - id: generic-high-entropy
    title: High-entropy string in secret-like context
    kind: generic-high-entropy
    regex: '(?i)(?:key|token|secret|auth|cred|signature|salt)[A-Za-z0-9_.-]{0,30}[''"]?\s*(?:[:=]|=>)\s*[''"]([A-Za-z0-9+/_=-]{32,300})[''"]'
    severity: MEDIUM
    confidence: LOW
    min_entropy: 4.2
    check: generic
    cwe: CWE-798
